name: PBN Watchlist Checker

on:
  schedule:
    - cron: '*/15 6-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-watchlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Clean check: Sets output variable 'has_items' to true/false without throwing exit errors
    - name: Check if Watchlist Has Items
      id: check_list
      run: |
        python -c "
        import json, os, sys
        has_items = False
        if os.path.exists('watchlist.json'):
            with open('watchlist.json') as f:
                data = json.load(f)
                if data:
                    has_items = True
        if has_items:
            print('Watchlist has items. Proceeding...')
            print('has_items=true' >> os.environ['GITHUB_OUTPUT'])
        else:
            print('Watchlist is empty. Skipping remaining steps.')
            print('has_items=false' >> os.environ['GITHUB_OUTPUT'])
        "

    # Only run heavy setup if has_items is 'true'
    - name: Install Dependencies & Chrome
      if: steps.check_list.outputs.has_items == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-chromedriver
        pip install selenium requests

    - name: Run Watcher
      if: steps.check_list.outputs.has_items == 'true'
      env:
        GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
      run: python watcher.py

    - name: Auto-commit Watchlist Updates
      if: steps.check_list.outputs.has_items == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update watchlist after check"
        file_pattern: "watchlist.json"
