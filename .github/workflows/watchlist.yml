name: PBN Watchlist Checker

on:
  schedule:
    - cron: '*/15 6-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-watchlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Check if Watchlist Has Items
      id: check_list
      run: |
        python -c "import json, os; data = json.load(open('watchlist.json')) if os.path.exists('watchlist.json') else []; print('has_items=' + str(bool(data)).lower(), file=open(os.environ['GITHUB_OUTPUT'], 'a'))"

    - name: Install Dependencies & Chrome
      if: steps.check_list.outputs.has_items == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-chromedriver
        pip install selenium requests

    - name: Run Watcher
      if: steps.check_list.outputs.has_items == 'true'
      env:
        GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
      run: python watcher.py

    - name: Auto-commit Watchlist Updates
      if: steps.check_list.outputs.has_items == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update watchlist after check"
        file_pattern: "watchlist.json"