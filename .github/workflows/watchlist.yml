name: PBN Watchlist Checker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-watchlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-chromedriver
        pip install selenium requests

    - name: Run Watcher
      env:
        GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
      run: python watcher.py

    - name: Auto-commit Watchlist Updates
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update watchlist after check"
        file_pattern: "watchlist.json"
