name: PBN Watchlist Checker

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-watchlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Fast Check: Exits in 5 seconds if watchlist is empty
    - name: Check if Watchlist Has Items
      id: check_list
      run: |
        python -c "
        import json, os, sys
        if not os.path.exists('watchlist.json'):
            sys.exit(1)
        with open('watchlist.json') as f:
            data = json.load(f)
        if not data:
            print('Watchlist is empty. Exiting early.')
            sys.exit(1)
        print('Items found in watchlist. Proceeding...')
        "
      continue-on-error: false

    # Heavy setup only runs when PBNs are actively on the watchlist
    - name: Install Dependencies & Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-chromedriver
        pip install selenium requests

    - name: Run Watcher
      env:
        GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
      run: python watcher.py

    - name: Auto-commit Watchlist Updates
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update watchlist after check"
        file_pattern: "watchlist.json"
