name: PBN Watchlist Checker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-watchlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-chromedriver
        pip install selenium requests

    - name: Run Watcher
      env:
        GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
      run: python watcher.py

    - name: Commit Updated Watchlist File
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add watchlist.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update watchlist after check"
        git push
